name: Setup and Build
description: Common setup steps for CI jobs (checkout, install dependencies, cache, and build)

inputs:
  check-latest:
    description: Whether setup-node should check for a newer Node patch matching .nvmrc
    required: false
    default: "false"
  turbo-cache:
    description: Whether to restore/save the Turbo remote local cache directory
    required: false
    default: "true"
  sync-main-ref:
    description: On pull_request, point local main at the PR base SHA for turbo/changeset comparisons
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Install Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
        registry-url: "https://registry.npmjs.org"
        cache: pnpm
        check-latest: ${{ inputs.check-latest == 'true' }}

    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash

    - name: Cache Turbo
      if: inputs.turbo-cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        # Unique primary key (job+sha) so each job can save; caches are immutable.
        # Prefer restoring build's .turbo so sparse jobs don't poison consecutive runs.
        key: ${{ runner.os }}-turbo-${{ hashFiles('**/turbo.json', '**/pnpm-lock.yaml') }}-${{ github.job }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-turbo-${{ hashFiles('**/turbo.json', '**/pnpm-lock.yaml') }}-build-
          ${{ runner.os }}-turbo-${{ hashFiles('**/turbo.json', '**/pnpm-lock.yaml') }}-${{ github.job }}-
          ${{ runner.os }}-turbo-${{ hashFiles('**/turbo.json', '**/pnpm-lock.yaml') }}-
          ${{ runner.os }}-turbo-
        path: .turbo

    - name: Provide ref to compare against
      if: inputs.sync-main-ref == 'true' && github.event_name == 'pull_request'
      run: |
        if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
          git fetch --depth=1 origin "$BASE_SHA"
        fi
        git branch -f main "$BASE_SHA"
      shell: bash
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
