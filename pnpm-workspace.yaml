minimumReleaseAge: 1440
packages:
  - "packages/*"
  - "apps/*"
  - "starters/*"
allowBuilds:
  "@parcel/watcher": true
  canvas: true
  esbuild: true
  fsevents: true
  unrs-resolver: true
  sharp: true
catalog:
  "@reduxjs/toolkit": "^2.13.0"
  "@playwright/test": "^1.64.1"
  "@types/jsdom": "^30.0.0"
  "canvas": "^3.1.0"
  "@types/lodash": "^4.17.26"
  "@types/node": "^24.19.2"
  "@types/react": "^19.3.0"
  "@types/react-dom": "~19.3.0"
  "@types/react-redux": "^7.1.34"
  "jsdom": "^30.1.3"
  "lodash": "^4.18.1"
  "ol": "^10.11.0"
  "pidusage": "^4.1.0"
  "playwright": "^1.64.1"
  "proj4": "^2.22.0"
  "react": "^19.3.1"
  "react-dom": "^19.3.1"
  "react-redux": "^9.3.0"
  "redux-batched-actions": "^0.5.0"
  "redux-thunk": "^3.1.0"
  "reselect": "^5.3.0"
  "tailwindcss": "^4.3.3"
  "typescript": "^6.0.3"
  "vitest": "^5.0.5"
  "zod": "^4.6.7"
minimumReleaseAgeExclude:
  - postcss@8.5.10
overrides:
  # Sass 1.106.0 crashes when serializing valid empty attribute selectors.
  sass: 1.105.1
  axios@<1.18.0: ^1.18.0
  brace-expansion@<1.1.21: ^1.1.21
  brace-expansion@>=2.0.0 <2.1.7: ^2.1.7
  brace-expansion@>=5.0.0 <5.0.12: ^5.0.12
  fast-uri@>=3.0.0 <3.1.8: ^3.1.8
  handlebars@<4.7.10: ^4.7.10
  js-yaml@>=4.0.0 <4.3.2: ^4.3.2
  postcss@<8.5.10: ^8.5.10
  postcss-selector-parser@<7.1.6: ^7.1.6
  read-yaml-file@<2.1.0: ^2.1.0
  shell-quote@<1.11.0: ^1.11.0
  source-map-js@<1.2.2: ^1.2.2
  undici@<7.29.0: ^7.29.0
  undici@>=8.0.0 <8.10.2: ^8.10.2
  "@mapsight/core": "workspace:*"
  "@mapsight/lib-js": "workspace:*"
  "@mapsight/lib-ol": "workspace:*"
  "@mapsight/lib-redux": "workspace:*"
  "@mapsight/traffic-style": "workspace:*"
  "@mapsight/ui": "workspace:*"
  "@mapsight/vite-host-embed": "workspace:*"
  "@mapsight/vector-style-compiler": "workspace:*"
